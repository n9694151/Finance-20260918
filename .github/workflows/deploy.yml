name: Deploy Finance AI Agent to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 設定 GitHub Pages 所需之權限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多個並行部屬衝突
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 設定 Node.js 執行環境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安裝專案套件相依 (Install Dependencies)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 執行 TypeScript 嚴格型別檢查 (Type Check)
        run: npm run typecheck

      - name: 建構前端靜態網站產物 (Build Static Assets)
        run: npm run build:client

      - name: 上傳靜態產物 (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署至 GitHub Pages (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
